spring.application.name=hostai-backend
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.threads.virtual.enabled=true
spring.main.keep-alive=true
spring.webflux.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.http.codecs.log-request-details=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
hostai.ollama-url=${HOSTAI_OLLAMA_URL:http://127.0.0.1:11434}

hostai.access-directory=${HOSTAI_ACCESS_DIR:}
hostai.guest-port=${HOSTAI_GUEST_PORT:8081}
hostai.cloudflared-path=${HOSTAI_CLOUDFLARED_PATH:}
hostai.runtime-urls=${HOSTAI_RUNTIME_URLS:}
hostai.openai-urls=${HOSTAI_OPENAI_URLS:}
